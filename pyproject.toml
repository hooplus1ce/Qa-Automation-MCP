[project]
name = "qa-automation-mcp"
version = "0.1.0"
description = "通用 UI 自动化测试 MCP 服务，包含浏览器、DOM、浮层与可选组件适配器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps]>=4.0,<5",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
]

[project.scripts]
qa-automation-mcp = "qa_automation.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
browser = [
    "playwright>=1.62",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F: pyflakes(含 F821 未定义名称,可静态抓住 import 遗漏类 P0)
# E/W: pycodacity, I: isort, B: bugbear, UP: pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E501", # 行长由 format 管理
]

[tool.ruff.lint.per-file-ignores]
# facade 模块:全部导入都是有意再导出(供 `import qa_automation as automation` 使用)
"qa_automation/__init__.py" = ["F401"]
"qa_automation/components/vtable/__init__.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["qa_automation"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_default_test_loop_scope = "function"
testpaths = ["tests", "zentao_mcp/tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "browser: tests that require a real Playwright browser or CDP endpoint",
    "slow: long-running integration tests",
]
